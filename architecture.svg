<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820">

  <!-- Background -->
  <rect width="1100" height="820" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" fill="#65a637" font-family="monospace" font-size="18" font-weight="bold">ChainGuard Architecture</text>
  <text x="550" y="52" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">Autonomous Supply Chain Threat Investigation Agent</text>

  <!-- ===== FRONTEND SECTION ===== -->
  <rect x="30" y="70" width="1040" height="100" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="90" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="bold">FRONTEND</text>
  <text x="155" y="90" fill="#8b949e" font-family="monospace" font-size="10">Next.js 16 + React Flow + Tailwind</text>

  <rect x="60" y="100" width="180" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="122" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">Command Center</text>
  <text x="150" y="138" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">KPIs, MITRE, MCP metrics</text>

  <rect x="270" y="100" width="220" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="380" y="122" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">Investigation Workspace</text>
  <text x="380" y="138" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">SSE stream, graph, timeline</text>

  <rect x="520" y="100" width="170" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="605" y="122" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">MITRE ATT&amp;CK View</text>
  <text x="605" y="138" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Technique heatmap</text>

  <rect x="720" y="100" width="170" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="805" y="122" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">Remediation Panel</text>
  <text x="805" y="138" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Human-in-the-loop</text>

  <!-- REST/SSE arrow down -->
  <polygon points="375,158 385,158 380,172" fill="#3b82f6"/>
  <rect x="375" y="158" width="10" height="37" fill="#3b82f6" rx="1"/>
  <polygon points="373,195 387,195 380,203" fill="#3b82f6"/>
  <text x="395" y="182" fill="#3b82f6" font-family="monospace" font-size="9">REST + SSE</text>

  <!-- ===== BACKEND SECTION ===== -->
  <rect x="30" y="210" width="1040" height="370" rx="8" fill="none" stroke="#65a637" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="230" fill="#65a637" font-family="monospace" font-size="13" font-weight="bold">BACKEND</text>
  <text x="130" y="230" fill="#8b949e" font-family="monospace" font-size="10">FastAPI + LangGraph + LangChain</text>

  <!-- Routes -->
  <rect x="55" y="245" width="155" height="95" rx="6" fill="#1c2333" stroke="#30363d"/>
  <text x="132" y="265" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">FastAPI Routes</text>
  <text x="132" y="282" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">POST /investigate</text>
  <text x="132" y="295" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">GET  /{id}/stream</text>
  <text x="132" y="308" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">POST /actions/approve</text>
  <text x="132" y="321" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">POST /{id}/stop</text>

  <!-- LangGraph container -->
  <rect x="235" y="245" width="820" height="325" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="255" y="265" fill="#65a637" font-family="monospace" font-size="12" font-weight="bold">LangGraph StateGraph</text>
  <text x="425" y="265" fill="#8b949e" font-family="monospace" font-size="9">Checkpointed (MemorySaver)</text>

  <!-- DETECT -->
  <rect x="265" y="280" width="140" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="335" y="302" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="12" font-weight="bold">DETECT</text>
  <text x="335" y="318" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Classify + extract IOCs</text>

  <!-- Arrow DETECT to SUPERVISOR -->
  <rect x="405" y="302" width="47" height="3" fill="#65a637"/>
  <polygon points="449,296 462,303 449,310" fill="#65a637"/>

  <!-- SUPERVISOR -->
  <rect x="465" y="280" width="155" height="50" rx="6" fill="#1a3320" stroke="#65a637" stroke-width="2"/>
  <text x="542" y="300" text-anchor="middle" fill="#65a637" font-family="monospace" font-size="11" font-weight="bold">SUPERVISOR</text>
  <text x="542" y="316" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Send() fan-out to 3</text>

  <!-- PARALLEL label -->
  <text x="540" y="348" text-anchor="middle" fill="#65a637" font-family="monospace" font-size="9" font-weight="bold">PARALLEL EXECUTION</text>

  <!-- Fan-out lines -->
  <line x1="500" y1="330" x2="340" y2="365" stroke="#65a637" stroke-width="2"/>
  <polygon points="334,360 345,368 340,358" fill="#65a637"/>
  <line x1="542" y1="330" x2="542" y2="365" stroke="#65a637" stroke-width="2"/>
  <polygon points="536,362 548,362 542,372" fill="#65a637"/>
  <line x1="585" y1="330" x2="740" y2="365" stroke="#65a637" stroke-width="2"/>
  <polygon points="735,358 746,368 741,360" fill="#65a637"/>

  <!-- IOC Hunter -->
  <rect x="265" y="375" width="150" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="340" y="397" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="bold">IOC Hunter</text>
  <text x="340" y="413" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Search indicators</text>
  <text x="340" y="425" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">across all indexes</text>

  <!-- Threat Intel -->
  <rect x="465" y="375" width="155" height="60" rx="6" fill="#2d1b4e" stroke="#a855f7"/>
  <text x="542" y="397" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">Threat Intel</text>
  <text x="542" y="413" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Known threats +</text>
  <text x="542" y="425" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">MITRE ATT&amp;CK mapping</text>

  <!-- Blast Radius -->
  <rect x="670" y="375" width="150" height="60" rx="6" fill="#3b2206" stroke="#f97316"/>
  <text x="745" y="397" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">Blast Radius</text>
  <text x="745" y="413" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Repos, pipelines,</text>
  <text x="745" y="425" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">endpoints, secrets</text>

  <!-- Converge lines to MERGE -->
  <line x1="340" y1="435" x2="510" y2="462" stroke="#22d3ee" stroke-width="2"/>
  <line x1="542" y1="435" x2="540" y2="462" stroke="#22d3ee" stroke-width="2"/>
  <line x1="745" y1="435" x2="570" y2="462" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="534,460 546,460 540,470" fill="#22d3ee"/>

  <!-- MERGE -->
  <rect x="468" y="472" width="148" height="42" rx="6" fill="#0c3543" stroke="#22d3ee"/>
  <text x="542" y="491" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">MERGE</text>
  <text x="542" y="505" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">LLM deduplication</text>

  <!-- Arrow MERGE to LOOP -->
  <rect x="539" y="514" width="3" height="15" fill="#65a637"/>
  <polygon points="534,527 546,527 540,535" fill="#65a637"/>

  <!-- LOOP -->
  <rect x="500" y="537" width="85" height="30" rx="6" fill="#161b22" stroke="#fbbf24" stroke-dasharray="4,2"/>
  <text x="542" y="556" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">LOOP? (3x)</text>

  <!-- Loop-back path -->
  <line x1="500" y1="552" x2="250" y2="552" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="250" y1="552" x2="250" y2="305" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2"/>
  <polygon points="246,310 254,310 250,300" fill="#fbbf24"/>
  <text x="255" y="435" fill="#fbbf24" font-family="monospace" font-size="8" transform="rotate(-90,255,435)">new IOCs</text>

  <!-- Arrow LOOP to ASSESS -->
  <rect x="585" y="550" width="92" height="3" fill="#65a637"/>
  <polygon points="674,544 687,551 674,558" fill="#65a637"/>

  <!-- ASSESS -->
  <rect x="690" y="530" width="150" height="42" rx="6" fill="#3b1111" stroke="#ef4444"/>
  <text x="765" y="549" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">ASSESS IMPACT</text>
  <text x="765" y="563" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Severity + blast radius</text>

  <!-- Arrow ASSESS to REMEDIATE -->
  <rect x="840" y="550" width="25" height="3" fill="#65a637"/>
  <polygon points="862,544 875,551 862,558" fill="#65a637"/>

  <!-- REMEDIATE -->
  <rect x="878" y="530" width="160" height="42" rx="6" fill="#1a3320" stroke="#65a637"/>
  <text x="958" y="549" text-anchor="middle" fill="#65a637" font-family="monospace" font-size="11" font-weight="bold">REMEDIATE</text>
  <text x="958" y="563" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Actions (HITL gate)</text>

  <!-- LLM callout -->
  <rect x="870" y="280" width="170" height="70" rx="6" fill="#161b22" stroke="#fbbf24"/>
  <text x="955" y="300" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">LLM (Groq)</text>
  <text x="955" y="316" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">llama-3.3-70b-versatile</text>
  <text x="955" y="332" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">via LangChain</text>
  <text x="955" y="345" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">~8 calls/investigation</text>

  <!-- MCP Metrics -->
  <rect x="55" y="355" width="155" height="50" rx="6" fill="#161b22" stroke="#22d3ee"/>
  <text x="132" y="377" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">MCP Metrics</text>
  <text x="132" y="393" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Latency, success rate</text>

  <!-- Storage -->
  <rect x="55" y="420" width="155" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="132" y="445" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">JSON Storage</text>

  <!-- ===== MCP ARROW ===== -->
  <rect x="539" y="580" width="3" height="42" fill="#f97316"/>
  <polygon points="534,620 546,620 540,630" fill="#f97316"/>
  <text x="555" y="607" fill="#f97316" font-family="monospace" font-size="10" font-weight="bold">MCP (Streamable HTTP)</text>

  <!-- ===== SPLUNK SECTION ===== -->
  <rect x="30" y="635" width="1040" height="170" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="655" fill="#f97316" font-family="monospace" font-size="13" font-weight="bold">SPLUNK ENTERPRISE</text>
  <text x="225" y="655" fill="#8b949e" font-family="monospace" font-size="10">Docker Container</text>

  <!-- MCP Server -->
  <rect x="370" y="668" width="310" height="42" rx="6" fill="#3b2206" stroke="#f97316"/>
  <text x="525" y="688" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">Splunk App for MCP</text>
  <text x="525" y="702" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">splunk_run_query + splunk_get_indexes</text>

  <!-- Indexes -->
  <rect x="55" y="720" width="190" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="740" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">Security Indexes</text>
  <text x="150" y="756" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="9">cicd_events | git_events</text>
  <text x="150" y="768" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="9">secret_audit | extensions</text>
  <text x="150" y="780" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="9">threat_intel</text>

  <!-- HEC -->
  <rect x="275" y="720" width="200" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="375" y="740" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">HEC Endpoint</text>
  <text x="375" y="756" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Synthetic attack data</text>
  <text x="375" y="768" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">3 scenarios: extension,</text>
  <text x="375" y="780" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">package, CI/CD</text>

  <!-- Splunk Web -->
  <rect x="505" y="720" width="180" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="595" y="740" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">Splunk Web UI</text>
  <text x="595" y="756" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">localhost:8000</text>
  <text x="595" y="768" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">Search + dashboards</text>

  <!-- Legend -->
  <rect x="720" y="720" width="330" height="70" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="885" y="740" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">Legend</text>
  <rect x="740" y="750" width="30" height="3" fill="#3b82f6"/>
  <text x="780" y="754" fill="#8b949e" font-family="monospace" font-size="9">REST API / SSE Stream</text>
  <rect x="740" y="764" width="30" height="3" fill="#65a637"/>
  <text x="780" y="768" fill="#8b949e" font-family="monospace" font-size="9">LangGraph pipeline flow</text>
  <rect x="740" y="778" width="30" height="3" fill="#f97316"/>
  <text x="780" y="782" fill="#8b949e" font-family="monospace" font-size="9">MCP / Splunk queries</text>

</svg>
